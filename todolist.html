<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TO-DO List</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="javascript.js" defer></script>
  </head>

  <body
    class="min-vh-100 bg-body-secondary d-flex justify-content-center align-items-center p-3"
  >
    <main
      class="container todo-container bg-white rounded-3 shadow-sm p-3 p-md-4"
    >
      <form id="taskForm" class="mb-2">
        <div class="input-group">
          <input
            type="text"
            id="taskInput"
            class="form-control bg-body-secondary border-0"
            placeholder="▤  Add items..."
            aria-label="New task"
          />

          <button class="btn btn-secondary fw-bold" type="submit">ADD ⊕</button>
        </div>
      </form>

      <fieldset class="task-fieldset">
        <ul class="list-group list-group-flush" id="taskList"></ul>
      </fieldset>
    </main>
  </body>
</html>
